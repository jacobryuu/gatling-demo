# Gatling Graphite mapping for Prometheus
# Format: gatling.<simulation>.<request>.<measurement>
# Measurement example: count, min, max, p50, p75, p95, p99

mappings:
- match: "gatling.*.*.*"
  name: "gatling_request_metrics"
  labels:
    simulation: "$1"
    request: "$2"
    measurement: "$3"

- match: "gatling.*.users.*"
  name: "gatling_user_metrics"
  labels:
    simulation: "$1"
    measurement: "$2"
