gatling {
  core {
    runDescription = "gatling-demo performance run"
    encoding       = "utf-8"
    extract {
      regex {
        cache = true # Enable regex caching for better performance
      }
    }
    directory {
      # results = "results"
    }
  }
  data {
    # Enable Graphite DataWriter
    writers = [console, file, graphite]
    graphite {
      host = "localhost" # Override via GATLING_DATA_GRAPHITE_HOST
      port = 2003      # Override via GATLING_DATA_GRAPHITE_PORT
      protocol = "tcp" # or "udp"
      rootPathPrefix = "gatling"
      bufferSize = 8192
      writeInterval = 1
    }
  }
  http {
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    perUserCacheMaxCapacity = 200
    warmUpUrl = "https://gatling.io"
    enablePreemptiveAuth = true
    ahc {
      connectTimeout = 10000
      requestTimeout = 60000
      keepAlive = true
      maxConnectionsPerHost = 500
      maxConnections = 1000
      maxRetry = 2
    }
    dns {
      queryTimeout = 5000
      maxTtl = 60
    }
  }
}
